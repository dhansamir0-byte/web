<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>App</title>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family:Arial,sans-serif;
		}
		.container{
			width:90%;
			min-height:100vh;
			margin: auto;
		}

		.container main{
			width:100%;
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			align-items: center;


		}

		main>div{
			width:100%;
			aspect-ratio:2/3;
			border: 2px solid red;

		}

		main>div img{
			width:100%;
			height:100%;
			object-fit: cover;
			object-position:center;
		}


		.container section{
			width:100%;
			display: flex;
			flex-wrap: wrap;
			justify-content: space-around;
			align-items: center;


		}

		section>div{
			width:300px;
			aspect-ratio:1/2;
			border: 2px solid red;

		}

		section>div img{
			width:100%;
			height:100%;
			object-fit: cover;
			object-position:center;
		}

		@media screen and (max-width:500px){
			section>div{
				width:100%;
			}

		}
	</style>
</head>
<body>
	<div class="container">
		<header>HEADER</header>
		<main>
			<div><img src="img1.jpg" alt="img1"/></div>
			<div><img src="img2.jpg" alt="img1"/></div>
			<div><img src="img3.jpg" alt="img1"/></div>
			<div><img src="img4.jpg" alt="img1"/></div>
		</main>


		<section>
		    <div><img src="img1.jpg" alt="img1"/></div>
			<div><img src="img2.jpg" alt="img1"/></div>
			<div><img src="img3.jpg" alt="img1"/></div>
			<div><img src="img4.jpg" alt="img1"/></div>
			<div><img src="img1.jpg" alt="img1"/></div>
			<div><img src="img2.jpg" alt="img1"/></div>
			<div><img src="img3.jpg" alt="img1"/></div>
			<div><img src="img4.jpg" alt="img1"/></div>


			
		</section>
	</div>
 


</body>
</html>
