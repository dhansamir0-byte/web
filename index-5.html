<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>from</title>

	<style>

		input[type=text]{
			width:300px;
			height:50px;
			border:2px solid red ;
			


		} 

		input[type=number]{
			width:300px;
			height:50px;
			border:2px solid red ;
		} 


		input[type=date]{
			width:300px;
			height:50px;
			border:2px solid red ;
		} 

		input[type=radio]{
			accent-color:green;

		}


		select{
			width:300px;
			height:50px;
			border:2px solid red;
		}


		form{
			background-color: wheat;
		}
		
		

	</style>

</head>

<body>

	<form>
		
	<fieldset>
		
		<label for="name">Name</label>
		<br>
		<input type="text" name="name">
		<br>
		<br>

		<label for="address">Address</label>
		<br>
		<input type="text" name="address">
		<br>
		<br>

		<label for="mobile">Mobile</label>
		<br>
		<input type="number" name="mobile">
		<br>
		<br>

		<label for="date">Date</label>
		<br>
		<input type="date" name="image">
		<br>
		<br>

		<label for="date">Select Gender</label>
		<br>
		<br>

		<input type="radio" name="male">
		<label for="gender">Male</label>
		<br>
		<br>
		<input type="radio" name="female">
		<label for="gender">Female</label>
		<br>
		<br>
		<input type="radio" name="other">
		<label for="gender">Other</label>


		<br>
		<br>

		
		<label for="gender">Select Courses</label>
		<br>
		<br>
		<input type="checkbox" name="hindi">
		<label for="Courses">Hindi</label>

		<br>
		<br>
		<input type="checkbox" name="urdu">
		<label for="Courses">Urdu</label>
		<br>
		<br>

		<input type="checkbox" name="english">
		<label for="Courses">English</label>
		<br>
		<br>
		<input type="checkbox" name="mundari">
		<label for="Courses">Mundari</label>
		<br>
		<br>
		<label for="Courses">Select Centre</label>
		<br>
		<br>

		<select name="Centre">
			<option value="Ranchi">Ranchi</option>
			<option value="Khunti">Khunti</option>
			<option value="Simdega">Simdega</option>
		</select>














	</fieldset>

	</form>

</body>
</html>
