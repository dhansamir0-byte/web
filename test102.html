<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		.container{
			 width:90%;
			 margin: auto;
			 height:100vh;
			 display: flex;
			 flex-wrap: wrap;
			 justify-content: center;
			 align-items: center;
		}

		.container>div{
			width:100%;
			aspect-ratio:3/2;
			border:2px solid red;
		}

		img{
			width:100%;
			height:100%;
			object-fit: cover;
			object-position: center;
		}


	</style>
</head>
<body>

	<div class="container">
		<div>
			<img src="img1.jpg" alt="adv"/>
		</div>
		<div><img src="img2.jpg" alt="adv"/></div>
		<div><img src="img3.jpg" alt="adv"/></div>
		<div><img src="img4.jpg" alt="adv"/></div>
	</div>

</body>
</html>
